---
include:
  - project: 'World/Phosh/meta-phosh'
    ref: '8605615b6ce98e97ad0ab83c6e6ee55ffbbe5865'
    file: '/ci/phosh-common-jobs.yml'
  - project: 'Infrastructure/freedesktop-ci-templates'
    ref: '6a40df92957c8ce9ee741aaccc5daaaf70545b1e'
    file: '/templates/ci-fairy.yml'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    # Don't trigger a branch pipeline if there is an open MR
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

stages:
  - build
  - test
  - style-checks
  - deploy

default:
  # Protect CI infra from rogue jobs
  timeout: 15 minutes
  # Allow jobs to be caneled on new commits
  interruptible: true
  # Retry on infra hickups automatically
  retry:
    max: 1
    when:
      - 'api_failure'
      - 'runner_system_failure'
      - 'scheduler_failure'
      - 'stuck_or_timeout_failure'

variables:
  # For ci-fairy
  FDO_UPSTREAM_REPO: World/Phosh/phosh-osk-data
  DEBIAN_IMAGE: $CI_REGISTRY/world/phosh/stevia/debian:v0.0.2026-08-19

.prep: &prep
  before_script:
    - apt-get -y update
    - apt-get -y build-dep .

.step: &build_step
  script:
    - mkdir -p out/
    - meson setup _build
    - meson test -C _build
    - dpkg-buildpackage -uc -us -rfakeroot -A
    - 'cp ../phosh-osk-data-*_$(dpkg-parsechangelog -SVersion)_all.deb out/'

test-pkg-deb:
  stage: test
  image: ${DEBIAN_IMAGE}
  needs: []
  variables:
    PHOSH_ADDITIONAL_PKGS: >
      python3-requests
      python3-tqdm
  script:
    - !reference [.phosh-prepare-apt]
    - ./phosh-osk-data-packager --language se --pkg deb

test-pkg-plain:
  stage: test
  image: ${DEBIAN_IMAGE}
  needs: []
  variables:
    PHOSH_ADDITIONAL_PKGS: >
      python3-requests
      python3-tqdm
  script:
    - !reference [.phosh-prepare-apt]
    - ./phosh-osk-data-packager --language se --pkg plain

# Sanity checks of MR settings and commit logs
sanity:
  extends:
    - .fdo.ci-fairy
  stage: build
  variables:
    GIT_DEPTH: "100"
  script: |
    ci-fairy check-commits --signed-off-by --junit-xml=commit-message-junit-report.xml
  artifacts:
    reports:
      junit: commit-message-junit-report.xml
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME'

check-meson:
  stage: style-checks
  extends:
    - .phosh-check-meson

build:native-debian-forky:
  stage: build
  image: ${DEBIAN_IMAGE}
  <<: *prep
  <<: *build_step
  artifacts:
    paths:
      - out/
